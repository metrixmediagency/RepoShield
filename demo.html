<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Review Portal Demo</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <!-- Open Graph Meta Tags for Telegram/WhatsApp Link Previews -->
    <meta property="og:title" content="Aegis Protocol - Live Demo">
    <meta property="og:description" content="Tap to experience the 5-star routing technology.">
    <!-- Using a high-quality fallback image for the link preview thumbnail -->
    <meta property="og:image" content="https://metrixmedia.vercel.app/Mockup_demo.jpg">
    <meta property="og:type" content="website">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Styling Library -->
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --text-main: #ffffff;
            --font-main: 'Outfit', sans-serif;
            --font-display: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Animated Mesh Gradient Background */
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            background-attachment: fixed;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            font-family: var(--font-main);
            color: var(--text-main);
        }
        
        /* Ambient background glow orbs */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
            filter: blur(40px);
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.4) 0%, transparent 70%);
            filter: blur(40px);
            z-index: 0;
        }

        /* Branding Top Corner */
        .brand-header {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 10;
        }

        .brand-header i {
            font-size: 1.5rem;
            color: #ffffff;
        }

        .brand-header span {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* Premium Frosted Glass Standee Card */
        .demo-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 105 / 148.5;
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 24px !important;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.05);
            padding: 8% 6%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header-section {
            margin-bottom: 2rem;
            width: 100%;
        }

        .header-section h2 {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            line-height: 1.1;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .header-section h3 {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.75rem;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .header-section p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e2e8f0;
            font-weight: 500;
        }

        /* Glassmorphic QR Wrapper */
        .qr-display {
            width: 65%;
            height: auto;
            aspect-ratio: 1/1;
            background: rgba(255, 255, 255, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.9) !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2) !important;
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 2rem auto;
            transition: transform 0.3s ease;
        }

        .qr-display:hover {
            transform: scale(1.02);
        }

        /* Minimal Footer */
        .instruction-box {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .tap-badge {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #6366f1;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            animation: bounce 2s infinite;
            z-index: 20;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -5px); }
        }

        .instruction-box i {
            font-size: 1.5rem;
            color: #ffffff;
            opacity: 0.9;
        }

        .instruction-box span {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.7);
        }

        @media (max-width: 600px) {
            .brand-header {
                top: 1.5rem;
                left: 1.5rem;
            }
            .header-section h2 {
                font-size: 1.8rem;
            }
            .header-section h3 {
                font-size: 1.2rem;
            }
            .qr-display {
                width: 75%;
            }
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <i class="fa-solid fa-chart-line"></i>
        <span>MetrixMedia</span>
    </div>

    <div class="demo-container">
        <div class="header-section">
            <h2 id="biz-name-display">Demo</h2>
            <h3 id="flyer-headline">Review Us</h3>
            <p id="flyer-sub">Scan or Tap the code below to experience the 5-star routing technology.</p>
        </div>

        <!-- NATIVE ANCHOR WRAPPER TO BYPASS IN-APP BROWSER BLOCKS -->
        <a id="native-qr-link" href="#" style="text-decoration: none; width: 100%; display: flex; justify-content: center; position: relative;">
            <div class="qr-display" id="qr-container" style="cursor: pointer;" title="Tap to Open Live Portal">
                <!-- QR code renders here -->
            </div>
            <!-- Placed outside qr-container so it survives innerHTML wipe -->
            <div class="tap-badge" id="tap-badge-el">👆 Tap / Scan to open</div>
        </a>

        <div class="instruction-box">
            <i class="fa-solid fa-star"></i>
            <span id="flyer-footer">Powered by Aegis Protocol</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const bizName = urlParams.get('name') || 'Your Business';
            const color = urlParams.get('color') || '#6366f1';
            const logo = urlParams.get('logo') || '';
            const qrDot = urlParams.get('qrDot') || 'rounded';
            const qrCorner = urlParams.get('qrCorner') || 'extra-rounded';
            const flyerHeadline = urlParams.get('flyerHeadline') || 'Review Us';
            const flyerSub = urlParams.get('flyerSub') || 'Scan or Tap the code below to experience the 5-star routing technology.';
            const flyerFooter = urlParams.get('flyerFooter') || 'Powered by Aegis Protocol';

            const validity = urlParams.get('validity');
            if (validity) {
                const banner = document.createElement('div');
                banner.style.cssText = 'position: absolute; top: 0; left: 0; right: 0; background: rgba(220,38,38,0.95); color: white; text-align: center; padding: 0.6rem; font-size: 0.95rem; font-weight: 700; z-index: 100; letter-spacing: 0.5px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);';
                banner.innerHTML = <i class="fa-solid fa-hourglass-half" style="margin-right: 8px; animation: pulse 2s infinite;"></i> Interactive Demo Expires in  + validity +  Hours;
                document.body.appendChild(banner);
                
                if (!document.getElementById('pulse-anim')) {
                    const style = document.createElement('style');
                    style.id = 'pulse-anim';
                    style.innerHTML = @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } };
                    document.head.appendChild(style);
                }
            }

            // Set business name in title
            const bizNameDisplay = document.getElementById('biz-name-display');
            if (bizNameDisplay) bizNameDisplay.textContent = bizName;
            
            const headEl = document.getElementById('flyer-headline');
            if (headEl) headEl.textContent = flyerHeadline;
            
            const subEl = document.getElementById('flyer-sub');
            if (subEl) subEl.textContent = flyerSub;
            
            const footEl = document.getElementById('flyer-footer');
            if (footEl) footEl.textContent = flyerFooter;

            const badgeEl = document.getElementById('tap-badge-el');
            if (badgeEl) badgeEl.textContent = '👆 Tap / Scan to open';

            document.title = `${bizName} - Review Portal Demo`;

            // Set primary color
            document.documentElement.style.setProperty('--primary', color);
            document.documentElement.style.setProperty('--primary-glow', color + '40');

            // Generate Portal URL correctly (Handle Vercel path omissions)
            let currentPortalUrl = urlParams.get('portalUrl');
            if (!currentPortalUrl) {
                const currentParams = window.location.search;
                // Force routing to portal.html regardless of whether the user is on /demo or /demo.html
                currentPortalUrl = window.location.origin + '/portal.html' + currentParams;
            }
            // Failsafe: Prevent empty/null URLs from crashing the QR renderer
            if (!currentPortalUrl || currentPortalUrl.includes('null')) {
                currentPortalUrl = 'https://metrixmedia.vercel.app/portal.html';
            }

            // Determine safe styling for QR code
            let innerCorner = 'square';
            if (qrCorner === 'extra-rounded' || qrCorner === 'rounded') innerCorner = 'dot';
            if (qrCorner === 'dot') innerCorner = 'dot';
            const safeQrDot = (qrDot === 'dots' || qrDot === 'classy') ? 'rounded' : qrDot;

            // STEP 1: Set button hrefs IMMEDIATELY with the full URL.
            // This makes tapping work right away, before any async operation.
            const qrLink = document.getElementById('native-qr-link');
            if (qrLink) qrLink.href = currentPortalUrl;

            // STEP 2: Separately try to shorten URL for QR code only (density reduction).
            async function buildQR() {
                let qrUrl = currentPortalUrl;
                try {
                    // is.gd has permissive CORS — works from browser fetch()
                    const resp = await fetch(`https://is.gd/create.php?format=simple&url=${encodeURIComponent(currentPortalUrl)}`);
                    if (resp.ok) {
                        const short = await resp.text();
                        if (short && short.startsWith('http') && short.length < 40) {
                            qrUrl = short.trim();
                            // Also update button hrefs to the shorter URL
                            if (qrLink) qrLink.href = qrUrl;
                        }
                    }
                } catch(e) { /* fallback to full URL for QR */ }

                const qrConfig = {
                    type: "canvas", // Revert to canvas. TinyURL fixes the blurry noise, preventing SVG crash entirely.
                    width: 220,
                    height: 220,
                    data: qrUrl,
                    qrOptions: { errorCorrectionLevel: 'M' },
                    dotsOptions: { color: "#000000", type: safeQrDot },
                    backgroundOptions: { color: "transparent" },
                    cornersSquareOptions: { type: qrCorner, color: "#000000" },
                    cornersDotOptions: { type: innerCorner, color: "#000000" }
                };

                if (logo && logo.trim() !== '') {
                    qrConfig.image = logo;
                    qrConfig.imageOptions = { crossOrigin: "anonymous", margin: 8, imageSize: 0.25, hideBackgroundDots: true };
                }

                requestAnimationFrame(() => {
                    const container = document.getElementById('qr-container');
                    container.innerHTML = '';
                    new QRCodeStyling(qrConfig).append(container);
                });
            }
            buildQR();
        });
    </script>
</body>
</html>
