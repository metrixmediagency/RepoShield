<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METRIX // 12-Post Credibility Grid Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-dark: #06090e;
      --panel-bg: #0b1017;
      --border-color: rgba(212, 175, 55, 0.2);
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #fce588 0%, #d4af37 50%, #997300 100%);
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Nav */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 1.1rem;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title span {
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--gold-primary);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .btn-solid {
      background: var(--gold-gradient);
      color: #000;
      border: none;
    }

    .btn-solid:hover {
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
      transform: translateY(-1px);
    }

    /* Main Container */
    .app-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
      height: calc(100vh - 65px);
      overflow: hidden;
    }

    /* Left Sidebar: Post Navigator */
    .sidebar {
      background: #080c12;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .post-item {
      padding: 12px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .post-item:hover {
      background: rgba(212, 175, 55, 0.06);
      border-color: rgba(212, 175, 55, 0.3);
    }

    .post-item.active {
      background: rgba(212, 175, 55, 0.12);
      border-color: var(--gold-primary);
    }

    .post-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--gold-primary);
    }

    .post-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-white);
    }

    .post-item-type {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Right Preview Stage */
    .stage-wrapper {
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111827 0%, #06090e 100%);
      overflow-y: auto;
      position: relative;
    }

    .controls-panel {
      position: absolute;
      top: 24px;
      right: 32px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    /* Canvas 1080x1080 Scale Container */
    .canvas-scaler {
      width: 580px;
      height: 580px;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }

    /* THE TRUE 1080x1080 ARTBOARD */
    #artboard {
      width: 1080px;
      height: 1080px;
      transform: scale(0.537); /* 580 / 1080 = 0.53703 */
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
      background: #070a0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px;
      box-sizing: border-box;
      user-select: none;
      overflow: hidden;
    }

    /* Shared Artboard Background Gradients & Textures */
    .artboard-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.08) 0%, rgba(7, 10, 15, 0) 70%),
                  linear-gradient(180deg, #090e15 0%, #05070a 100%);
      z-index: 1;
    }

    .artboard-grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 2;
    }

    .artboard-border-frame {
      position: absolute;
      inset: 40px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      pointer-events: none;
      z-index: 3;
    }

    .artboard-corner-decor {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--gold-primary);
      border-style: solid;
      z-index: 4;
    }
    .c-tl { top: 36px; left: 36px; border-width: 2px 0 0 2px; }
    .c-tr { top: 36px; right: 36px; border-width: 2px 2px 0 0; }
    .c-bl { bottom: 36px; left: 36px; border-width: 0 0 2px 2px; }
    .c-br { bottom: 36px; right: 36px; border-width: 0 2px 2px 0; }

    /* Artboard Content Container */
    .artboard-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .artboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 24px;
    }

    .artboard-brand {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .artboard-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      letter-spacing: 2px;
      color: rgba(212, 175, 55, 0.8);
      text-transform: uppercase;
      background: rgba(212, 175, 55, 0.08);
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .artboard-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 24px;
      font-size: 18px;
      color: var(--text-muted);
    }

    .artboard-footer .mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: rgba(212, 175, 55, 0.9);
    }

    /* Template Styles */

    /* Typography Manifesto Layout (Post 1) */
    .manifesto-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      padding: 20px 0;
      gap: 28px;
    }

    .manifesto-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      color: var(--gold-primary);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .manifesto-headline {
      font-family: 'Cinzel', serif;
      font-size: 56px;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .manifesto-headline .accent-gold {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
      margin-top: 12px;
    }

    .manifesto-sub {
      font-size: 26px;
      line-height: 1.5;
      color: #cbd5e1;
      font-weight: 400;
      max-width: 820px;
    }

    /* Data Comparison Table Layout (Post 7) */
    .table-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      gap: 32px;
    }

    .table-title {
      font-family: 'Cinzel', serif;
      font-size: 44px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .comp-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .comp-card.highlight {
      background: rgba(212, 175, 55, 0.05);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
    }

    .comp-header {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .comp-card.highlight .comp-header {
      color: var(--gold-primary);
      border-color: rgba(212, 175, 55, 0.3);
    }

    .comp-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      color: #cbd5e1;
    }

    .comp-row .val {
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .comp-row.total {
      margin-top: 8px;
      padding-top: 14px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      font-size: 22px;
    }

    .comp-row.total .val.danger {
      color: #f87171;
    }

    .comp-row.total .val.success {
      color: #4ade80;
    }

    .delta-badge {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: #4ade80;
      padding: 16px;
      border-radius: 6px;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Guarantee Badge Layout (Post 3) */
    .guarantee-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      gap: 32px;
    }

    .shield-badge-icon {
      width: 100px;
      height: 100px;
      border: 2px solid var(--gold-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(212, 175, 55, 0.1);
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.25);
    }

    .shield-badge-icon svg {
      width: 50px;
      height: 50px;
      fill: var(--gold-primary);
    }

    .guarantee-title {
      font-family: 'Cinzel', serif;
      font-size: 54px;
      font-weight: 800;
      line-height: 1.2;
      color: #fff;
    }

    .guarantee-title span {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
    }

    .guarantee-points {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
      width: 100%;
      max-width: 760px;
      margin-top: 10px;
    }

    .g-point {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.03);
      padding: 16px 20px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 22px;
      color: #e2e8f0;
    }

    .g-point-check {
      color: var(--gold-primary);
      font-weight: 800;
      font-size: 24px;
    }

    /* Specs Blueprint Layout (Post 8) */
    .specs-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      gap: 28px;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .spec-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 6px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .spec-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--gold-primary);
      letter-spacing: 1px;
    }

    .spec-label {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }

    .spec-desc {
      font-size: 18px;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* Monogram Clean Card (Post 10) */
    .monogram-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      gap: 24px;
    }

    .vector-mark-container {
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .vector-mark-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.3));
    }

    .monogram-title {
      font-family: 'Cinzel', serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 12px;
      margin-right: -12px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .monogram-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #cbd5e1;
      font-weight: 500;
    }

    .monogram-entity {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      letter-spacing: 2px;
      color: rgba(212, 175, 55, 0.6);
      text-transform: uppercase;
      margin-top: 12px;
    }

    /* Caption Drawer / Output Box */
    .caption-box {
      margin-top: 24px;
      background: rgba(11, 16, 23, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px 20px;
      max-width: 580px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .caption-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .caption-header span {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .caption-text {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.5;
      white-space: pre-line;
      max-height: 100px;
      overflow-y: auto;
    }

    /* Notification Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--gold-primary);
      color: #000;
      padding: 12px 24px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 9999;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>

  <!-- Top Navigation -->
  <header>

      METRIX <span>// 12-Post Credibility Grid Generator</span>

    <div class="nav-actions">

  </div>

  <div id="toast">Notification</div>

    let currentPostIndex = 0;

    // Initialize Sidebar
    function initSidebar() {
      const list = document.getElementById('postList');
      list.innerHTML = '';
      posts.forEach((post, idx) => {
        const item = document.createElement('div');
        item.className = `post-item ${idx === currentPostIndex ? 'active' : ''}`;
        item.onclick = () => selectPost(idx);
        item.innerHTML = `
          <div class="post-item-header">
            <span>POST ${String(post.id).padStart(2, '0')}</span>
            <span>${post.gridPos.split(' ')[0]}</span>
          </div>
          <div class="post-item-title">${post.title}</div>
          <div class="post-item-type">${post.category}</div>
        `;
        list.appendChild(item);
      });
    }

    // Select Post & Render
    function selectPost(idx) {
      currentPostIndex = idx;
      initSidebar();
      const p = posts[idx];
      document.getElementById('artboardContent').innerHTML = p.render();
      document.getElementById('captionText').textContent = p.caption;
    }

    // Download 1080x1080 PNG via html2canvas
    function downloadImage() {
      const btn = document.getElementById('download-btn');
      const originalText = btn.textContent;
      btn.textContent = 'Rendering 1080p...';
      btn.disabled = true;

      const artboard = document.getElementById('artboard');

      // Temporarily reset CSS transform to capture native 1080x1080
      const originalTransform = artboard.style.transform;
      artboard.style.transform = 'none';

      html2canvas(artboard, {
        width: 1080,
        height: 1080,
        scale: 1,
        backgroundColor: '#070a0f',
        useCORS: true,
        allowTaint: true,
        logging: false
      }).then(canvas => {
        artboard.style.transform = originalTransform;
        btn.textContent = originalText;
        btn.disabled = false;

        // Trigger Download
        const link = document.createElement('a');
        const filename = `metrix_post_${String(posts[currentPostIndex].id).padStart(2, '0')}.png`;
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();

        showToast(`Downloaded ${filename} (1080x1080)`);
      }).catch(err => {
        artboard.style.transform = originalTransform;
        btn.textContent = originalText;
        btn.disabled = false;
        console.error(err);
        showToast('Rendering error. Check console.');
      });
    }

    // Copy Caption to Clipboard
    function copyCaption() {
      const text = posts[currentPostIndex].caption;
      navigator.clipboard.writeText(text).then(() => {
        showToast('Caption copied to clipboard!');
      }).catch(() => {
        showToast('Failed to copy caption.');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'show';
      setTimeout(() => {
        toast.className = '';
      }, 2500);
    }

    // Initial load
    initSidebar();
    selectPost(0);
  </script>
