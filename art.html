<!DOCTYPE html>

        <button class="hud-btn" onclick="resetZoom()" title="Reset Scale"><i class="fa-solid fa-rotate-right"></i></button>
    </div>

    <!-- Pan & Zoom Engine -->
    <script>
        let scale = 1;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        let isPanning = false;

        const viewport = document.getElementById('art-viewport');
        const container = document.getElementById('art-container');
        const zoomText = document.getElementById('zoom-level');

        function setTransform() {
            container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            zoomText.innerText = `${Math.round(scale * 100)}% SCALE`;
        }

        viewport.onmousedown = function (e) {
            e.preventDefault();
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
            isPanning = true;
        };

        window.onmouseup = function () {
            isPanning = false;
        };

        window.onmousemove = function (e) {
            if (!isPanning) return;
            e.preventDefault();
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            setTransform();
        };

        viewport.onwheel = function (e) {
            e.preventDefault();
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            const delta = -e.deltaY;
            
            if (delta > 0) {
                scale = Math.min(scale * 1.15, 6);
            } else {
                scale = Math.max(scale / 1.15, 0.4);
            }

            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;
            setTransform();
        };

        function zoomIn() {
            scale = Math.min(scale * 1.25, 6);
            setTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.25, 0.4);
            setTransform();
        }

        function resetZoom() {
            scale = 1;
            pointX = 0;
            pointY = 0;
            setTransform();
        }

        // Initialize responsive fit on mobile
        window.addEventListener('DOMContentLoaded', () => {
            if (window.innerWidth < 768) {
                scale = 0.55;
                setTransform();
            }
        });
    </script>
